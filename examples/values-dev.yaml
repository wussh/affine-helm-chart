# Working local/dev AFFiNE install:
# chart-managed single-container PostgreSQL and Redis, chart-rendered dummy
# credentials, no external dependencies. Never use these credentials anywhere
# real. For production use secrets.mode=existing with an external secret
# manager (External Secrets Operator, Sealed Secrets, ...).
application:
  enabled: true
migration:
  enabled: true
databaseProvisioning:
  # container mode uses the built-in admin credentials; no separate role
  # provisioning. Enable only with everest mode.
  enabled: false
prerequisites:
  enabled: true
  database:
    mode: container
    name: affine-postgres
    # namespace defaults to the release namespace when empty
    secret:
      username: affine
      password: "local-dev-only-not-a-real-credential"
    persistence:
      create: true
      existingClaim: ""
      retain: true
  redis:
    enabled: true
    persistence:
      create: true
      existingClaim: ""
      retain: true
secrets:
  mode: create
  database:
    name: affine-database
    # DATABASE_URL is published by the chart-managed bootstrap Job once the
    # database is reachable; POSTGRES_* are only needed for databaseProvisioning.
    data:
      DATABASE_URL: ""
      POSTGRES_USERNAME: ""
      POSTGRES_PASSWORD: ""
  redis:
    name: affine-redis
    data:
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: "6379"
      REDIS_SERVER_USERNAME: default
      REDIS_SERVER_PASSWORD: "local-dev-only-not-a-real-credential"
      REDIS_SERVER_DATABASE: "0"
persistence:
  storage:
    create: true
    existingClaim: ""
    retain: true
  config:
    create: true
    existingClaim: ""
    retain: true
routing:
  mode: none
config:
  serverName: AFFiNE Dev
  externalUrl: http://localhost:3010
