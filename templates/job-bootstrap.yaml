{{- if eq (include "affine.bootstrapActive" .) "true" }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "affine.fullname" . }}-bootstrap-{{ include "affine.bootstrapChecksum" . }}
  labels: {{- include "affine.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.prerequisites.bootstrap.activeDeadlineSeconds }}
  {{- if gt (int .Values.jobRetentionSeconds) 0 }}
  ttlSecondsAfterFinished: {{ .Values.jobRetentionSeconds }}
  {{- end }}
  # The pod template is rendered by affine.bootstrapPodTemplate, which is also
  # what affine.bootstrapChecksum hashes: the Job body and its name can never
  # disagree about which revision runs.
  template:
    {{- include "affine.bootstrapPodTemplate" . | nindent 4 }}
{{- end }}
