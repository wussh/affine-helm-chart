{{- if and .Values.prerequisites.enabled (eq .Values.secrets.mode "create") (ne .Values.prerequisites.database.mode "external") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "affine.fullname" . }}-bootstrap-{{ include "affine.migrationChecksum" . }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.prerequisites.bootstrap.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "affine.fullname" . }}-bootstrap
      containers:
        - name: bootstrap
          image: {{ .Values.prerequisites.bootstrap.image }}
          command: [sh, -ec]
          args:
            - |
              {{- if eq .Values.prerequisites.database.mode "everest" }}
              until [ "$(kubectl -n {{ .Values.prerequisites.database.namespace }} get databasecluster {{ .Values.prerequisites.database.name }} -o jsonpath='{.status.status}')" = ready ]; do sleep 5; done
              HOST_KEY=pgbouncer-host
              PORT_KEY=pgbouncer-port
              {{- else }}
              HOST={{ .Values.prerequisites.database.name }}.{{ .Values.prerequisites.database.namespace }}.svc
              PORT=5432
              {{- end }}
              until kubectl -n {{ .Values.prerequisites.database.namespace }} get secret {{ .Values.prerequisites.database.userSecretName }} >/dev/null 2>&1; do sleep 5; done
              USER=$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret {{ .Values.prerequisites.database.userSecretName }} -o jsonpath='{.data.user}' | base64 -d)
              PASSWORD=$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret {{ .Values.prerequisites.database.userSecretName }} -o jsonpath='{.data.password}' | base64 -d)
              {{- if eq .Values.prerequisites.database.mode "everest" }}
              HOST=$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret {{ .Values.prerequisites.database.userSecretName }} -o jsonpath='{.data.pgbouncer-host}' | base64 -d)
              PORT=$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret {{ .Values.prerequisites.database.userSecretName }} -o jsonpath='{.data.pgbouncer-port}' | base64 -d)
              {{- end }}
              until nc -z "$HOST" "$PORT"; do sleep 5; done
              {{- if .Values.prerequisites.redis.enabled }}
              until nc -z {{ .Values.prerequisites.redis.name }}.{{ .Release.Namespace }}.svc 6379; do sleep 5; done
              {{- end }}
              ENCODED_USER=$(printf %s "$USER" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')
              ENCODED_PASSWORD=$(printf %s "$PASSWORD" | od -An -tx1 | tr -d ' \n' | sed 's/../%&/g')
              kubectl -n {{ .Release.Namespace }} create secret generic {{ include "affine.databaseSecretName" . }} \
                --from-literal=DATABASE_URL="postgresql://${ENCODED_USER}:${ENCODED_PASSWORD}@${HOST}:${PORT}/{{ .Values.prerequisites.database.container.database }}" \
                --dry-run=client -o yaml | kubectl apply -f -
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
{{- end }}
