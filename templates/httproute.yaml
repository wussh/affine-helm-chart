{{- if and .Values.application.enabled (eq .Values.routing.mode "gateway") }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "affine.fullname" . }}
  labels: {{- include "affine.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  hostnames: [{{ .Values.routing.host }}]
  parentRefs:
    - name: {{ .Values.routing.gateway.name }}
      namespace: {{ .Values.routing.gateway.namespace }}
      sectionName: {{ .Values.routing.gateway.httpsSectionName }}
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      backendRefs: [{name: {{ include "affine.fullname" . }}, port: {{ .Values.service.port }}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "affine.fullname" . }}-redirect
  labels: {{- include "affine.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  hostnames: [{{ .Values.routing.host }}]
  parentRefs:
    - name: {{ .Values.routing.gateway.name }}
      namespace: {{ .Values.routing.gateway.namespace }}
      sectionName: {{ .Values.routing.gateway.httpSectionName }}
  rules:
    - matches: [{path: {type: PathPrefix, value: /}}]
      filters: [{type: RequestRedirect, requestRedirect: {scheme: https, statusCode: 308}}]
{{- end }}
