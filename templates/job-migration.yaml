{{- if .Values.migration.enabled }}
{{- $migrationVersion := include "affine.migrationVersion" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "affine.migrationJobName" . }}
  labels: {{- include "affine.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migrationActiveDeadlineSeconds }}
  {{- if gt (int .Values.jobRetentionSeconds) 0 }}
  ttlSecondsAfterFinished: {{ .Values.jobRetentionSeconds }}
  {{- end }}
  # The pod template is rendered by affine.migrationPodTemplate, which is also
  # what affine.migrationChecksum hashes: the Job body and its name can never
  # disagree about which revision runs.
  template:
    {{- include "affine.migrationPodTemplate" (merge (dict "markerVersion" $migrationVersion) .) | nindent 4 }}
{{- end }}
