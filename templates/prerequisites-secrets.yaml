{{- $_ := include "affine.validateInlineSecrets" . }}
{{- if and .Values.prerequisites.enabled (ne .Values.prerequisites.database.mode "external") .Values.prerequisites.database.secret.create (not (lookup "v1" "Secret" .Values.prerequisites.database.namespace (include "affine.databaseBootstrapSecretName" .))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "affine.databaseBootstrapSecretName" . }}
  namespace: {{ .Values.prerequisites.database.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "-3", helm.sh/resource-policy: keep}
type: Opaque
stringData:
  user: {{ .Values.prerequisites.database.secret.username | quote }}
  password: {{ .Values.prerequisites.database.secret.password | quote }}
{{ end }}
{{- if .Values.secrets.database.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "affine.databaseSecretName" . }}
  namespace: {{ .Values.secrets.database.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
type: Opaque
stringData:
  POSTGRES_USERNAME: {{ required "secrets.database.data.POSTGRES_USERNAME is required when creating AFFiNE database Secret" .Values.secrets.database.data.POSTGRES_USERNAME | quote }}
  POSTGRES_PASSWORD: {{ required "secrets.database.data.POSTGRES_PASSWORD is required when creating AFFiNE database Secret" .Values.secrets.database.data.POSTGRES_PASSWORD | quote }}
{{- if or (not .Values.databaseProvisioning.enabled) (eq .Values.prerequisites.database.mode "external") }}
  DATABASE_URL: {{ required "secrets.database.data.DATABASE_URL is required when creating AFFiNE database Secret" .Values.secrets.database.data.DATABASE_URL | quote }}
{{- end }}
{{ end }}
{{- if .Values.secrets.redis.secret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "affine.redisSecretName" . }}
  namespace: {{ .Values.secrets.redis.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "0"}
type: Opaque
stringData:
  REDIS_SERVER_HOST: {{ required "secrets.redis.data.REDIS_SERVER_HOST is required when creating Redis Secret" .Values.secrets.redis.data.REDIS_SERVER_HOST | quote }}
  REDIS_SERVER_PORT: {{ required "secrets.redis.data.REDIS_SERVER_PORT is required when creating Redis Secret" .Values.secrets.redis.data.REDIS_SERVER_PORT | quote }}
  REDIS_SERVER_USERNAME: {{ required "secrets.redis.data.REDIS_SERVER_USERNAME is required when creating Redis Secret" .Values.secrets.redis.data.REDIS_SERVER_USERNAME | quote }}
  REDIS_SERVER_PASSWORD: {{ required "secrets.redis.data.REDIS_SERVER_PASSWORD is required when creating Redis Secret" .Values.secrets.redis.data.REDIS_SERVER_PASSWORD | quote }}
  REDIS_SERVER_DATABASE: {{ required "secrets.redis.data.REDIS_SERVER_DATABASE is required when creating Redis Secret" .Values.secrets.redis.data.REDIS_SERVER_DATABASE | quote }}
{{ end }}
