{{- if .Values.databaseProvisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "affine.databaseProvisioningJobName" . }}
  labels: {{- include "affine.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migrationActiveDeadlineSeconds }}
  {{- if gt (int .Values.jobRetentionSeconds) 0 }}
  ttlSecondsAfterFinished: {{ .Values.jobRetentionSeconds }}
  {{- end }}
  # The pod template is rendered by affine.databaseProvisioningPodTemplate, which
  # is also what affine.databaseProvisioningChecksum hashes: the Job body and its
  # name can never disagree about which revision runs.
  template:
    {{- include "affine.databaseProvisioningPodTemplate" . | nindent 4 }}
{{- end }}
