{{- if .Values.databaseProvisioning.enabled }}
{{- $checksum := include "affine.databaseProvisioningChecksum" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "affine.databaseProvisioningJobName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
{{ if .Values.helmHooks }}
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{ end }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migrationActiveDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "affine.fullname" . }}-bootstrap
      automountServiceAccountToken: true
      initContainers:
        - name: load-secrets
          image: {{ .Values.prerequisites.bootstrap.image }}
          command: [sh, -ec]
          args:
            - |
              umask 077
              mkdir -p /run/affine-secrets
              ADMIN_SECRET={{ include "affine.databaseAdminSecretName" . }}
              APP_SECRET={{ include "affine.databaseApplicationSecretName" . }}
              until test -n "$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.hostKey }}']}" 2>/dev/null)"; do sleep 5; done
              until test -n "$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.portKey }}']}" 2>/dev/null)"; do sleep 5; done
              until test -n "$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.usernameKey }}']}" 2>/dev/null)"; do sleep 5; done
              until test -n "$(kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.passwordKey }}']}" 2>/dev/null)"; do sleep 5; done
              until test -n "$(kubectl -n {{ .Values.secrets.database.namespace }} get secret "$APP_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.application.usernameKey }}']}" 2>/dev/null)"; do sleep 5; done
              until test -n "$(kubectl -n {{ .Values.secrets.database.namespace }} get secret "$APP_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.application.passwordKey }}']}" 2>/dev/null)"; do sleep 5; done
              kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.hostKey }}']}" | base64 -d > /run/affine-secrets/pg-host
              kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.portKey }}']}" | base64 -d > /run/affine-secrets/pg-port
              kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.usernameKey }}']}" | base64 -d > /run/affine-secrets/pg-user
              kubectl -n {{ .Values.prerequisites.database.namespace }} get secret "$ADMIN_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.admin.passwordKey }}']}" | base64 -d > /run/affine-secrets/pg-password
              kubectl -n {{ .Values.secrets.database.namespace }} get secret "$APP_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.application.usernameKey }}']}" | base64 -d > /run/affine-secrets/app-user
              kubectl -n {{ .Values.secrets.database.namespace }} get secret "$APP_SECRET" -o jsonpath="{.data['{{ .Values.databaseProvisioning.application.passwordKey }}']}" | base64 -d > /run/affine-secrets/app-password
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: secret-data, mountPath: /run/affine-secrets}
      containers:
        - name: database-provision
          image: {{ .Values.prerequisites.database.container.image }}
          command: [sh, -ec]
          args:
            - |
              umask 077
              trap 'rm -f /tmp/provision.sql' EXIT
              PGHOST=$(cat /run/affine-secrets/pg-host)
              PGPORT=$(cat /run/affine-secrets/pg-port)
              PGUSER=$(cat /run/affine-secrets/pg-user)
              PGPASSWORD=$(cat /run/affine-secrets/pg-password)
              APP_USER=$(cat /run/affine-secrets/app-user)
              APP_PASSWORD=$(cat /run/affine-secrets/app-password)
              export PGHOST PGPORT PGUSER PGPASSWORD PGSSLMODE=require
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; do sleep 5; done
              export APP_USER APP_PASSWORD APP_DATABASE
              cat > /tmp/provision.sql <<'SQL'
              \getenv app_user APP_USER
              \getenv app_password APP_PASSWORD
              \getenv app_database APP_DATABASE
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'app_user', :'app_password')
              WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'app_user') \gexec
              ALTER ROLE :"app_user" LOGIN PASSWORD :'app_password';
              SELECT format('CREATE DATABASE %I OWNER %I', :'app_database', :'app_user')
              WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = :'app_database') \gexec
              GRANT ALL PRIVILEGES ON DATABASE :"app_database" TO :"app_user";
              SQL
              psql -v ON_ERROR_STOP=1 -d postgres -f /tmp/provision.sql
          env:
            - name: APP_DATABASE
              value: {{ .Values.databaseProvisioning.database | quote }}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - {name: secret-data, mountPath: /run/affine-secrets, readOnly: true}
      volumes:
        - name: secret-data
          emptyDir:
            medium: Memory
{{- end }}
