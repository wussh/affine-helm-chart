{{- if and .Values.prerequisites.enabled (eq .Values.prerequisites.database.mode "container") }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.prerequisites.database.name }}-data
  namespace: {{ .Values.prerequisites.database.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2", helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.prerequisites.database.storageClass }}
  resources:
    requests: {storage: {{ .Values.prerequisites.database.storageSize }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.prerequisites.database.name }}
  namespace: {{ .Values.prerequisites.database.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ .Values.prerequisites.database.name }}}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.prerequisites.database.name }}
  namespace: {{ .Values.prerequisites.database.namespace }}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector: {matchLabels: {app.kubernetes.io/name: {{ .Values.prerequisites.database.name }}}}
  template:
    metadata: {labels: {app.kubernetes.io/name: {{ .Values.prerequisites.database.name }}}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.prerequisites.database.container.image }}
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: {{ .Values.prerequisites.database.userSecretName }}, key: user}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ .Values.prerequisites.database.userSecretName }}, key: password}}
            - name: POSTGRES_DB
              value: {{ .Values.prerequisites.database.container.database | quote }}
          ports: [{name: postgres, containerPort: 5432}]
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          startupProbe: {tcpSocket: {port: postgres}, failureThreshold: 30, periodSeconds: 10}
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: 10}
          livenessProbe: {exec: {command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}, periodSeconds: 20}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: {{ .Values.prerequisites.database.name }}-data}}]
{{- end }}
