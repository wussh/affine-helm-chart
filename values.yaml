replicaCount: 1
helmHooks: false

application:
  enabled: false
migration:
  enabled: true
  templateRevision: "1"
  waitIntervalSeconds: 5

databaseProvisioning:
  enabled: false
  database: affine
  image:
    repository: wushie/affine-db-bootstrap
    tag: sha-a093cc8
    digest: sha256:a4d188f62069f24328a553cf62b257b3960834ce8908ee3984bfaf5f3e0e0c38
    pullPolicy: IfNotPresent
  admin:
    secretName: ""
    hostKey: pgbouncer-host
    portKey: pgbouncer-port
    usernameKey: user
    passwordKey: password
  application:
    usernameKey: POSTGRES_USERNAME
    passwordKey: POSTGRES_PASSWORD
  waitIntervalSeconds: 5
  waitTimeoutSeconds: 300

prerequisites:
  enabled: false
  database:
    mode: everest
    name: db-affine
    namespace: prod
    userSecretName: everest-secrets-db-affine
    secret:
      # Inline credentials suit local/dev use; production should use external Secrets, Sealed Secrets, or an approved secret manager.
      create: false
      name: everest-secrets-db-affine
      username: ""
      password: ""
    version: "16.4"
    storageClass: storage-nvme-c1
    storageSize: 25Gi
    replicas: 1
    container:
      image: docker.io/library/postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
      database: postgres
  bootstrap:
    image: docker.io/alpine/k8s@sha256:b0523f0a244ddc4c8e055aa335c040d3d78b3ead5528f4544395f7f9f69c7b68
    activeDeadlineSeconds: 900
  redis:
    enabled: true
    name: affine-redis
    image: docker.io/library/redis@sha256:bb142a9c18ac18a16713c1491d779697b4e107c22a97266616099d288237ef47
    storageClass: storage-nvme-c1
    storageSize: 5Gi

image:
  repository: ghcr.io/toeverything/affine
  tag: "0.27.4"
  digest: sha256:b649f5ce2384ffdf13c23bccf81d759e15973d59d0b0058af65d895a84373099
  pullPolicy: IfNotPresent

secrets:
  mode: existing
  database:
    name: affine-database
    namespace: affine
    secret:
      # Inline credentials suit local/dev use; production should use external Secrets, Sealed Secrets, or an approved secret manager.
      create: false
      username: ""
      password: ""
    data:
      DATABASE_URL: ""
      POSTGRES_USERNAME: ""
      POSTGRES_PASSWORD: ""
  redis:
    name: affine-redis
    namespace: affine
    secret:
      # Inline credentials suit local/dev use; production should use external Secrets, Sealed Secrets, or an approved secret manager.
      create: false
      password: ""
    data:
      REDIS_SERVER_HOST: affine-redis
      REDIS_SERVER_PORT: "6379"
      REDIS_SERVER_USERNAME: default
      REDIS_SERVER_PASSWORD: ""
      REDIS_SERVER_DATABASE: "0"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "4"
    memory: "4Gi"
migrationResources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "2Gi"
migrationActiveDeadlineSeconds: 900

serviceAccount:
  create: true
  name: ""

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

persistence:
  storage:
    existingClaim: affine-storage
    size: 20Gi
    storageClass: storage-nvme-c1
  config:
    existingClaim: affine-config
    size: 1Gi
    storageClass: storage-nvme-c1

probes:
  startup:
    httpGet: {path: /api/health, port: 3010}
    failureThreshold: 30
    periodSeconds: 10
  readiness:
    httpGet: {path: /api/health, port: 3010}
    periodSeconds: 10
  liveness:
    httpGet: {path: /api/health, port: 3010}
    periodSeconds: 20

service:
  type: ClusterIP
  port: 3010

routing:
  mode: none
  host: affine.dev.tbs.cloudeka.xyz
  ingress:
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: lets-encrypt-http-issuer
      nginx.ingress.kubernetes.io/proxy-body-size: "100m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    tlsSecretName: affine-tls
  gateway:
    name: gateway-external
    namespace: kgateway-system
    httpSectionName: http
    httpsSectionName: https

config:
  serverName: AFFiNE Internal
  externalUrl: https://affine.dev.tbs.cloudeka.xyz
